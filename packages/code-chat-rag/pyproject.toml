[project]
name = "code-chat-rag"
version = "0.1.0"
description = "RAG module for code-chat CLI"
readme = "README.md"
authors = [
    { name = "Tetsuya Higashi", email = "996846+sluchin@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.3.15",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.3.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/code_chat_rag"]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
