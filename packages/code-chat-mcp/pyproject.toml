[project]
name = "code-chat-mcp"
version = "0.1.0"
description = "MCP module for code-chat CLI"
readme = "README.md"
authors = [
    { name = "Tetsuya Higashi", email = "996846+sluchin@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "code-chat-lib",
    "chromadb>=1.5.9",
    "esprima>=4.0.1",
    "google-genai>=2.24.0",
    "mcp>=2.2.0",
]

[tool.uv.sources]
code-chat-lib = { workspace = true }

#[tool.uv.build-backend]
#source-dir = "src"
[tool.hatch.build.targets.wheel]
packages = ["src/code_chat_mcp"]

#[build-system]
#requires = ["uv_build>=0.12.1,<0.13.0"]
#build-backend = "uv_build"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
