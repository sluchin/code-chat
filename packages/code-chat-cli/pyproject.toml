[project]
name = "code-chat-cli"
version = "0.1.0"
description = "CLI tool for interacting with and modifying local codebase via LLMs"
readme = "README.md"
authors = [
    { name = "Tetsuya Higashi", email = "996846+sluchin@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.16.0",
    "mypy>=2.3.0",
    "pylint>=4.0.6",
    "ruff>=0.16.1",
    "code-chat-rag",
    "code-chat-mcp",
]

[tool.uv.sources]
code-chat-rag = { workspace = true }
code-chat-mcp = { workspace = true }

[project.scripts]
code-chat = "code_chat_cli.chat:main"
cchat = "code_chat_cli.chat:main"

[tool.hatch.build.targets.wheel]
packages = ["src/code_chat_cli"]

#[build-system]
#requires = ["uv_build>=0.12.1,<0.13.0"]
#build-backend = "uv_build"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "furo>=2025.12.19",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "sphinx>=9.1.0",
    "sphinx-autobuild>=2025.8.25",
]
