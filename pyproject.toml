[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
addopts = [
    "--cov=packages/code-chat-cli/src/code_chat_cli",
    "--cov=packages/code-chat-rag/src/code_chat_rag",
    "--cov-report=term-missing",
]
testpaths = ["tests"]
pythonpath = [
    "packages/code-chat-cli/src",
    "packages/code-chat-rag/src",
]
filterwarnings = [
    # 該当する DeprecationWarning をメッセージの部分一致で無視
    "ignore:.*UnionGenericAlias.*:DeprecationWarning",
]

[tool.pylint.master]
ignore-paths = [
    "^docs/.*",
    "^.venv/.*",
    "^build/.*",
    "^dist/.*",
]
