[project]
name = "code-chat"
version = "0.1.0"
readme = "README.md"
authors = [
    { name = "Tetsuya Higashi", email = "996846+sluchin@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "code-chat-cli",
]

[project.scripts]
code-chat = "code_chat_cli.chat:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/code-chat-cli/src/code_chat_cli"]

[tool.uv.sources]
code-chat-cli = { workspace = true }
code-chat-lib = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest-cov>=7.1.0",
]

[tool.ruff.lint]
# import の並び順 (isort) も検査する
extend-select = ["I"]

[tool.ruff.lint.isort]
# ワークスペースの 4 パッケージは, どのパッケージから見ても, 自分たちのコード (first-party) として並べる
known-first-party = ["code_chat_cli", "code_chat_lib", "code_chat_mcp", "code_chat_rag"]

[tool.pytest.ini_options]
addopts = [
    "--cov=packages/code-chat-cli/src/code_chat_cli",
    "--cov=packages/code-chat-lib/src/code_chat_lib",
    "--cov=packages/code-chat-rag/src/code_chat_rag",
    "--cov=packages/code-chat-mcp/src/code_chat_mcp",
    "--cov-report=term-missing",
]
testpaths = ["tests"]
pythonpath = [
    "packages/code-chat-cli/src",
    "packages/code-chat-lib/src",
    "packages/code-chat-rag/src",
    "packages/code-chat-mcp/src",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.report]
fail_under = 100

[tool.pylint.master]
ignore-paths = [
    "^docs/.*",
    "^.venv/.*",
    "^build/.*",
    "^dist/.*",
]

[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",     # モジュール冒頭の docstring 要求を無効化
    "missing-function-docstring",   # 関数の docstring 必須チェックを無効化
    "redefined-outer-name",         # pytest の fixture 利用で発生する警告を抑止
    "invalid-name",                 # Sphinx の conf.py 等での小文字定数名を許容
    "redefined-builtin",            # conf.py の copyright 警告を抑止
    "too-many-instance-attributes", # CLI引数クラスの属性数制限を緩和
    "too-many-locals",              # 関数内のローカル変数数制限を緩和
    "too-many-branches",            # 条件分岐数制限を緩和
    "too-many-statements",          # ステートメント数制限を緩和
    "line-too-long",                # 行長警告は ruff / black に任せる
    "too-many-lines",               # モジュールあたりの行数制限を緩和
    "too-few-public-methods",       # データ保持や単一責務のクラスでのメソッド数制限を緩和
]
