name: Deploy Documentation

on:
  push:
    tags:
      - 'v*' # v1.0.0 などのバージョンタグがプッシュされた際に実行
  workflow_dispatch:


# GitHub Pages へのデプロイに必要な権限の設定
permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行制御（重複したデプロイジョブの自動キャンセル）
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # uv のセットアップ
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Python のセットアップ（uv 経由）
      - name: Set up Python
        run: uv python install

      # 依存関係のインストール（pyproject.toml または uv.lock に基づいてインストール）
      - name: Install dependencies
        run: uv sync

      # ドキュメントのビルド（docs ディレクトリに移動して make apidoc を実行）
      - name: Build documentation
        run: |
          cd docs
          uv run make apidoc

      # GitHub Pages の初期設定
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # ビルド成果物（生成されたHTML）のアップロード
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/_build/html'

      # GitHub Pages へデプロイ
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
